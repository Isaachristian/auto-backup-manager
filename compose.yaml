services:
  app:
    image: ${DOCKERHUB_USERNAME:?Set DOCKERHUB_USERNAME in .env}/auto-backup-manager:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_PATH: /data/auth.sqlite
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - app-data:/data

volumes:
  app-data:
    name: auto-backup-manager-data
